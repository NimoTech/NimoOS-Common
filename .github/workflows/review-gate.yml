# Deployment prerequisite: allow GitHub Actions to create and approve pull requests
# at organization and target-repository level; keep default token permissions read-only.
name: Review Merge Gate
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened, converted_to_draft, labeled, unlabeled, edited, closed]
  workflow_run:
    workflows: [Review Gate Events, Review Policy Tests, CI, PR Check YAML, validate docker compose file]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
    paths: ['.github/scripts/**', '.github/workflows/**', '.github/CODEOWNERS', 'AGENTS.md']
  workflow_dispatch:
    inputs:
      auto_merge_retry:
        description: Internal bounded mergeability retry counter
        required: false
        default: '0'
      auto_merge_numbers:
        description: Internal PR scope for bounded retries
        required: false
        default: '[]'
permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: write
  statuses: write
env:
  NIMO_GATE_EPOCH: ${{ github.run_id }}.${{ github.run_attempt }}
jobs:
  invalidate:
    if: >-
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.event == 'pull_request_review' ||
       github.event.workflow_run.event == 'pull_request_review_comment' ||
       github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'pull_request_target') &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
        github.event.comment.user.login == 'claude[bot]' ||
        ((github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR') &&
         (contains(github.event.comment.body, '@codex') ||
          contains(github.event.comment.body, '@claude') ||
          contains(github.event.changes.body.from, '@codex') ||
          contains(github.event.changes.body.from, '@claude'))))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      heads: ${{ steps.invalidate.outputs.heads }}
      failures: ${{ steps.invalidate.outputs.failures }}
      numbers: ${{ steps.invalidate.outputs.numbers }}
      affected_heads: ${{ steps.invalidate.outputs.affected_heads }}
      epoch: ${{ steps.invalidate.outputs.epoch }}
      started_at: ${{ steps.invalidate.outputs.started_at }}
    steps:
      - name: Block previous verdicts before the publisher queue
        id: invalidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import datetime, json, os, re, urllib.request
          started_at = datetime.datetime.now(datetime.timezone.utc).isoformat()
          repo = os.environ["GITHUB_REPOSITORY"]
          with open(os.environ["GITHUB_EVENT_PATH"]) as f:
              event = json.load(f)
          default = event["repository"]["default_branch"]
          def call(path, method="GET", payload=None):
              req = urllib.request.Request("https://api.github.com/" + path, method=method,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json", "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.load(response)
          heads = set()
          all_pulls = []
          for page in range(1, 101):
              pulls = call(f"repos/{repo}/pulls?state=open&per_page=100&page={page}")
              all_pulls.extend(pulls)
              heads.update(p["head"]["sha"] for p in pulls if p["base"]["ref"] == default)
              if len(pulls) < 100:
                  break
          else:
              raise RuntimeError("Open PR pagination exceeded the safe bound")
          errors = []
          trigger = event.get("pull_request", {}).get("number") or event.get("issue", {}).get("number")
          run = event.get("workflow_run", {})
          if not trigger and run.get("pull_requests"):
              triggered_numbers = {p["number"] for p in run["pull_requests"]}
          else:
              title = re.fullmatch(r"Review gate event for PR #(\d+)", run.get("display_title", ""))
              if not trigger and title:
                  trigger = int(title.group(1))
              triggered_numbers = {trigger} if trigger else set()
          if not triggered_numbers and event.get("inputs", {}).get("auto_merge_numbers"):
              retry_numbers = json.loads(event["inputs"]["auto_merge_numbers"])
              if not isinstance(retry_numbers, list) or not all(type(n) is int and n > 0 for n in retry_numbers):
                  raise RuntimeError("Invalid retry PR scope")
              triggered_numbers = set(retry_numbers)
          candidate = re.fullmatch(r"Candidate review policy for PR #(\d+) at [0-9a-f]{40}", run.get("display_title", ""))
          if not triggered_numbers and candidate:
              triggered_numbers = {int(candidate.group(1))}
          affected = {p["head"]["sha"] for p in all_pulls
                      if p["base"]["ref"] == default and p["number"] in triggered_numbers}
          closed_head = event.get("pull_request", {}).get("head", {}).get("sha")
          if closed_head:
              affected.update(p["head"]["sha"] for p in all_pulls
                              if p["base"]["ref"] == default and p["head"]["sha"] == closed_head)
          # A PR-specific event must not consume every other PR's finite status
          # history. Global policy updates/manual refreshes still invalidate all.
          if not triggered_numbers:
              affected = heads
          for sha in sorted(affected):
              status_blocked = False
              try:
                  history = []
                  for page in range(1, 101):
                      batch = call(f"repos/{repo}/commits/{sha}/statuses?per_page=100&page={page}")
                      history.extend(s for s in batch if s.get("context", "").lower() == "nimo review approval")
                      if len(batch) < 100:
                          break
                  else:
                      raise RuntimeError("Status pagination exceeded the safe bound")
                  exhausted = len(history) >= 900
                  wanted = "failure" if exhausted else "pending"
                  latest = history[0] if history else None
                  epoch = os.environ.get("NIMO_GATE_EPOCH")
                  marker = "Review epoch " + epoch + ": " if epoch else ""
                  if not (latest and latest.get("state") == wanted
                          and (not epoch or (latest.get("description") or "").startswith(marker))
                          and latest.get("creator", {}).get("id") == 41898282
                          and latest.get("creator", {}).get("login") == "github-actions[bot]"):
                      pending = call(f"repos/{repo}/statuses/{sha}", "POST", {
                          "context": "Nimo Review Approval", "state": wanted,
                          "description": marker + ("Push a new commit: status history is near its limit." if exhausted else
                              "Review evidence is being checked before loading the gate."),
                          "target_url": "https://github.com/" + repo + "/actions/runs/" + os.environ.get("GITHUB_RUN_ID", "0")})
                      if (pending.get("creator", {}).get("id") != 41898282
                              or pending.get("creator", {}).get("login") != "github-actions[bot]"):
                          raise RuntimeError("Unexpected status publisher")
                  status_blocked = True
                  if exhausted:
                      raise RuntimeError("Status history is near its limit; a new commit is required")
                  check = call(f"repos/{repo}/check-runs", "POST", {
                      "name": "Nimo Review Gate", "head_sha": sha,
                      "external_id": "nimo-review-gate:" + sha, "status": "in_progress",
                      "started_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      "output": {"title": "Evaluating trusted reviews",
                                 "summary": "Review evidence is being checked before loading the gate."}})
                  if check.get("app", {}).get("id") != 15368:
                      raise RuntimeError("Unexpected check publisher")
              except Exception as error:
                  errors.append(sha)
                  print(sha[:12], "blocking check failed:", type(error).__name__)
                  # A failed history read does not prove that publishing a
                  # required failure also fails. Try that independent fallback.
                  if not status_blocked:
                      try:
                          blocked = call(f"repos/{repo}/statuses/{sha}", "POST", {
                              "context": "Nimo Review Approval", "state": "failure",
                              "description": ("Review epoch " + os.environ["NIMO_GATE_EPOCH"] + ": " if os.environ.get("NIMO_GATE_EPOCH") else "") + "Fresh review verification could not start."})
                          if (blocked.get("creator", {}).get("id") != 41898282
                                  or blocked.get("creator", {}).get("login") != "github-actions[bot]"):
                              raise RuntimeError("Unexpected status publisher")
                          status_blocked = True
                      except Exception as fallback:
                          print(sha[:12], "required status invalidation failed:", type(fallback).__name__)
                  try:
                      checks = call(f"repos/{repo}/commits/{sha}/check-runs?per_page=100&filter=all")["check_runs"]
                      own = [c for c in checks if c["name"] == "Nimo Review Gate"
                             and c.get("app", {}).get("id") == 15368
                             and c.get("external_id") == "nimo-review-gate:" + sha]
                      for check in own:
                          call(f"repos/{repo}/check-runs/{check['id']}", "PATCH", {
                              "status": "completed", "conclusion": "failure",
                              "completed_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                              "output": {"title": "Merge blocked", "summary": "Fresh review verification could not start."}})
                  except Exception as fallback:
                      print(sha[:12], "fallback invalidation failed:", type(fallback).__name__)
                  # Revoke our PR-specific approval independently of status publication.
                  for pull in all_pulls:
                      if pull["head"]["sha"] != sha or pull["base"]["ref"] != default:
                          continue
                      try:
                          number = pull["number"]
                          reviews = []
                          for page in range(1, 101):
                              batch = call(f"repos/{repo}/pulls/{number}/reviews?per_page=100&page={page}")
                              reviews.extend(batch)
                              if len(batch) < 100:
                                  break
                          else:
                              raise RuntimeError("Review pagination exceeded the safe bound")
                          for review in reviews:
                              managed = (review.get("user", {}).get("id") == 41898282
                                      and review.get("user", {}).get("login") == "github-actions[bot]"
                                      and (review.get("body") or "").startswith("<!-- nimo-review-gate-approval -->"))
                              native = (review.get("user", {}).get("type") == "Bot"
                                        and review.get("user", {}).get("login") in
                                            {"chatgpt-codex-connector[bot]", "claude[bot]"})
                              if review["state"] == "APPROVED" and (managed or (native and not status_blocked)):
                                  dismissed = call(f"repos/{repo}/pulls/{number}/reviews/{review['id']}/dismissals", "PUT", {
                                      "message": "审查检查无法初始化，等待重新核对最新提交。"})
                                  if dismissed.get("state") != "DISMISSED":
                                      raise RuntimeError("Bridge approval was not revoked")
                      except Exception as fallback:
                          print(sha[:12], "approval revocation failed:", type(fallback).__name__)
          # Isolate bad commit groups. Healthy groups must reach the publisher.
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("NIMO_GATE_BOOTSTRAP_STARTED_AT=" + started_at + "\n")
              env.write("NIMO_GATE_BOOTSTRAP_HEADS=" + json.dumps(sorted(heads)) + "\n")
              env.write("NIMO_GATE_BOOTSTRAP_FAILURES=" + json.dumps(errors) + "\n")
              env.write("NIMO_GATE_BOOTSTRAP_NUMBERS=" + json.dumps(sorted(triggered_numbers)) + "\n")
              env.write("NIMO_GATE_BOOTSTRAP_AFFECTED_HEADS=" + json.dumps(sorted(affected)) + "\n")
          if os.environ.get("GITHUB_OUTPUT"):
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("epoch=" + os.environ.get("NIMO_GATE_EPOCH", "") + "\n")
                  output.write("started_at=" + started_at + "\n")
                  output.write("heads=" + json.dumps(sorted(heads)) + "\n")
                  output.write("failures=" + json.dumps(errors) + "\n")
                  output.write("numbers=" + json.dumps(sorted(triggered_numbers)) + "\n")
                  output.write("affected_heads=" + json.dumps(sorted(affected)) + "\n")
          if errors:
              print("::warning::Blocked " + str(len(errors)) + " failed commit groups; continuing healthy groups")
          PYTHON
  gate:
    # Only this trusted metadata publisher may request protected squash merges.
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: read
      checks: write
      statuses: write
    needs: invalidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: nimo-review-merge-gate
      cancel-in-progress: false
      queue: max
    env:
      NIMO_GATE_EPOCH: ${{ needs.invalidate.outputs.epoch }}
      NIMO_GATE_BOOTSTRAP_STARTED_AT: ${{ needs.invalidate.outputs.started_at }}
      NIMO_GATE_BOOTSTRAP_HEADS: ${{ needs.invalidate.outputs.heads }}
      NIMO_GATE_BOOTSTRAP_FAILURES: ${{ needs.invalidate.outputs.failures }}
      NIMO_GATE_BOOTSTRAP_NUMBERS: ${{ needs.invalidate.outputs.numbers }}
      NIMO_GATE_BOOTSTRAP_AFFECTED_HEADS: ${{ needs.invalidate.outputs.affected_heads }}
    steps:
      - name: Read trusted default-branch gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/workflows
          sparse-checkout-cone-mode: false
      - name: Install pinned workflow parser
        run: >-
          python3 -m pip install --quiet --disable-pip-version-check --only-binary=:all: --require-hashes -r .github/scripts/review-requirements.txt
      - name: Verify gate policy
        id: verify
        run: >-
          env -u NIMO_GATE_EPOCH -u NIMO_GATE_BOOTSTRAP_STARTED_AT -u NIMO_GATE_BOOTSTRAP_HEADS
          -u NIMO_GATE_BOOTSTRAP_FAILURES -u NIMO_GATE_BOOTSTRAP_NUMBERS
          -u NIMO_GATE_BOOTSTRAP_AFFECTED_HEADS -u GITHUB_OUTPUT
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -q
      - name: Publish current-commit review gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/review_gate.py

      - name: Squash PRs after verified review and GitHub requirements
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/auto_merge.py
